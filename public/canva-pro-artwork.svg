<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="1000" height="1000">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="canvaBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00C4CC" />
      <stop offset="35%" stop-color="#3B82F6" />
      <stop offset="70%" stop-color="#7C3AED" />
      <stop offset="100%" stop-color="#4F46E5" />
    </linearGradient>

    <!-- Radial Glow Behind Card -->
    <radialGradient id="centerGlow" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.35" />
      <stop offset="50%" stop-color="#00C4CC" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#7C3AED" stop-opacity="0" />
    </radialGradient>

    <!-- Gold Crown Gradient -->
    <linearGradient id="goldCrown" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFBEB" />
      <stop offset="30%" stop-color="#FCD34D" />
      <stop offset="70%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>

    <!-- Pro Pill Gradient -->
    <linearGradient id="proPill" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="50%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="shadowCard" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="25" stdDeviation="30" flood-color="#020617" flood-opacity="0.45" />
    </filter>
    <filter id="glowGold" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#F59E0B" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1000" height="1000" fill="url(#canvaBg)" rx="48" />
  <rect width="1000" height="1000" fill="url(#centerGlow)" rx="48" />

  <!-- Subtle Decorative Floating Circles -->
  <circle cx="180" cy="200" r="140" fill="#FFFFFF" fill-opacity="0.08" />
  <circle cx="850" cy="240" r="160" fill="#00C4CC" fill-opacity="0.15" />
  <circle cx="820" cy="820" r="220" fill="#7C3AED" fill-opacity="0.25" />
  <circle cx="140" cy="800" r="120" fill="#FFFFFF" fill-opacity="0.05" />

  <!-- Main Card Container -->
  <g filter="url(#shadowCard)">
    <rect x="150" y="160" width="700" height="680" rx="36" fill="#0F172A" fill-opacity="0.88" stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="2.5" />
  </g>

  <!-- Card Inner Accent Header Ribbon -->
  <rect x="150" y="160" width="700" height="8" fill="url(#canvaBg)" rx="4" />

  <!-- Canva Script Wordmark / Big "C" Symbol -->
  <g transform="translate(500, 360)">
    <!-- Cyan/Violet Swirl Outer Circle -->
    <circle cx="0" cy="0" r="115" fill="url(#canvaBg)" filter="url(#shadowCard)" />
    <circle cx="0" cy="0" r="105" fill="#0B1329" />
    <circle cx="0" cy="0" r="95" fill="url(#canvaBg)" fill-opacity="0.25" />
    
    <!-- Stylized Canva "C" Ribbon -->
    <path d="M 35 -40 C 20 -70 -25 -70 -50 -45 C -75 -20 -75 25 -45 50 C -15 75 35 60 48 30 C 52 20 40 15 32 25 C 20 45 -10 50 -30 35 C -50 20 -50 -15 -32 -32 C -18 -45 10 -45 22 -28 C 28 -20 40 -25 35 -40 Z" fill="#FFFFFF" />
    <circle cx="28" cy="-12" r="8" fill="#F59E0B" />
  </g>

  <!-- Gold Crown Icon for PRO -->
  <g transform="translate(500, 520)" filter="url(#glowGold)">
    <path d="M -50 25 L -45 -20 L -15 5 L 0 -35 L 15 5 L 45 -20 L 50 25 Z" fill="url(#goldCrown)" />
    <circle cx="-45" cy="-24" r="5" fill="#FFFBEB" />
    <circle cx="0" cy="-39" r="6" fill="#FFFBEB" />
    <circle cx="45" cy="-24" r="5" fill="#FFFBEB" />
    <rect x="-50" y="27" width="100" height="8" rx="4" fill="url(#goldCrown)" />
  </g>

  <!-- Product Title -->
  <text x="500" y="625" text-anchor="middle" font-family="'Space Grotesk', 'Inter', system-ui, sans-serif" font-size="44" font-weight="800" fill="#FFFFFF" letter-spacing="1">
    Canva Pro
  </text>

  <!-- Tagline / Features -->
  <text x="500" y="670" text-anchor="middle" font-family="'Inter', system-ui, sans-serif" font-size="20" font-weight="600" fill="#94A3B8" letter-spacing="0.5">
    Premium Unlimited Design Tools &amp; Templates
  </text>

  <!-- PRO Gold Pill Badge -->
  <g transform="translate(500, 740)" filter="url(#glowGold)">
    <rect x="-110" y="-22" width="220" height="44" rx="22" fill="url(#proPill)" />
    <text x="0" y="6" text-anchor="middle" font-family="'Space Grotesk', system-ui, sans-serif" font-size="18" font-weight="800" fill="#0F172A" letter-spacing="2">
      ★ LIFETIME / 1 YEAR ★
    </text>
  </g>

  <!-- Verified Brand Footer Badge -->
  <g transform="translate(500, 930)">
    <rect x="-180" y="-20" width="360" height="40" rx="20" fill="#0F172A" fill-opacity="0.85" stroke="#FFFFFF" stroke-opacity="0.2" stroke-width="1.5" />
    <circle cx="-145" cy="0" r="8" fill="#10B981" />
    <path d="M -148 0 L -146 3 L -142 -3" stroke="#FFFFFF" stroke-width="2" fill="none" stroke-linecap="round" />
    <text x="-125" y="5" font-family="'Inter', system-ui, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF" letter-spacing="0.8">
      100% GENUINE &amp; VERIFIED SUBSCRIPTION
    </text>
  </g>
</svg>
